<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    下角饰（左下）：比上角收敛的卷草，只做「框住角落」的收口。
    基准几何贴着盒子的左上画，再用 translate(0 32) scale(1 -1) 翻到底部，
    这样弧线实际抱住卡片的左下角。
  -->
  <g transform="translate(0 32) scale(1 -1)">
    <g fill="none" stroke-linecap="round">
      <path d="M29 8 C18 10 10 18 8 29" stroke="#b8934a" stroke-width="1.4"/>
      <path d="M29 8 C18 10 10 18 8 29" stroke="#ecd692" stroke-width="0.5" opacity="0.8" transform="translate(-0.6 -0.6)"/>
      <path d="M29 8 c2.6 -0.6 3.4 -2.5 1.9 -4" stroke="#b8934a" stroke-width="1.1"/>
      <path d="M8 29 c-0.6 2.6 -2.5 3.4 -4 1.9" stroke="#b8934a" stroke-width="1.1"/>
    </g>
    <path d="M14.5 20 C16.5 17 19.5 16 22 16.6 C20.5 19.5 17.5 20.8 14.5 20 Z" fill="#c9a74a"/>
  </g>
</svg>
